name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test Suite to Run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - full
      company:
        description: 'Company'
        required: true
        default: 'sample'
        type: choice
        options:
          - 'sample'
          - 'bm technology'
          - 'development'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      BEFFA_USER: ${{ secrets.BEFFA_USER }}
      BEFFA_PASS: ${{ secrets.BEFFA_PASS }}
      # Priority: manual input (if dispatch) > repo secret > hardcoded default
      BEFFA_TOKEN: ${{ secrets.BEFFA_TOKEN }}
      BEFFA_COMPANY: ${{ github.event.inputs.company || secrets.BEFFA_COMPANY || 'sample' }}
      TEST_TYPE: ${{ github.event.inputs.test_type || 'full' }}
      BEFFA_YEAR: ${{ secrets.BEFFA_YEAR || '2018' }}
      BEFFA_PERIOD: ${{ secrets.BEFFA_PERIOD || 'yearly' }}
      BEFFA_CALENDAR: ${{ secrets.BEFFA_CALENDAR || 'ec' }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # LTS version recommended
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache playwright binaries
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Browsers & Deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps

    - name: Install Playwright OS Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Fetch Company from ERP API
      if: github.event_name != 'workflow_dispatch'
      continue-on-error: true
      run: |
        chmod +x scripts/fetch_company.sh
        ./scripts/fetch_company.sh

    - name: Run Playwright tests
      if: always()
      continue-on-error: true
      run: |
        # Setup test filters based on user selection
        if [ "$TEST_TYPE" = "smoke" ]; then
          GREP_ARGS="--grep @smoke"
        elif [ "$TEST_TYPE" = "regression" ]; then
          GREP_ARGS="--grep @regression"
        elif [ "$TEST_TYPE" = "full" ]; then
          GREP_ARGS="--grep @full"
        else
          GREP_ARGS=""
        fi

        echo "Test Type Selected: $TEST_TYPE (Grep args: $GREP_ARGS)"
        echo "Company Target: $BEFFA_COMPANY"

        # ✅ RESET accumulator so percentages are fresh for THIS run only
        mkdir -p deploy
        rm -f deploy/dashboard-accumulated.json
        echo "🗑️ Reset dashboard accumulator for clean run."

        # Disable exit on error so we run ALL batches even if Part 1 fails!
        set +e
        FINAL_EXIT_CODE=0

        # 1. RUN CONCURRENT WORKFLOWS (FAST - 4 Workers)
        echo "=========================================================="
        echo "🚀 PART 1: Running Standard UI Workflows in Parallel..."
        echo "=========================================================="
        npx playwright test --project=Inventory --project=Sales-Workflows --project=Purchase-Workflows --workers=4 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?

        # 2. RUN FORENSIC AUDITS (SAFE - 1 Worker) - Only run if not a smoke test!
        if [ "$TEST_TYPE" != "smoke" ]; then
          echo "=========================================================="
          echo "🛡️ PART 2: Running Deep Forensic Audits (Sequential)..."
          echo "=========================================================="
          
          echo "-> Forensic Sales..."
          npx playwright test --project=Forensic-Sales --workers=1 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?

          echo "-> Forensic Purchase..."
          npx playwright test --project=Forensic-Purchase --workers=1 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?

          echo "-> Forensic Inventory..."
          npx playwright test --project=Forensic-Inventory --workers=1 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?
        else
          echo "=========================================================="
          echo "⏭️ Skipping deep Forensic Audits for Smoke run."
          echo "=========================================================="
        fi

        # Re-enable exit on error and exit with the captured code
        set -e
        if [ $FINAL_EXIT_CODE -ne 0 ]; then
          echo "❌ Some test batches failed. Check logs above."
          exit $FINAL_EXIT_CODE
        fi
    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure Executor Info
      if: always()
      run: |
        mkdir -p allure-results
        echo '{
          "name": "GitHub Actions",
          "type": "github",
          "url": "https://github.com/tekleab/beffa-automation/actions/runs/${{ github.run_id }}",
          "buildOrder": "${{ github.run_id }}",
          "buildName": "Playwright Tests #${{ github.run_id }}",
          "buildUrl": "https://github.com/tekleab/beffa-automation/actions/runs/${{ github.run_id }}"
        }' > allure-results/executor.json

    - name: Setup Java for Allure
      uses: actions/setup-java@v3
      if: always()
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Allure Report
      if: always()
      run: |
        # 1. Prepare history baseline
        mkdir -p allure-results/history
        if [ -d "gh-pages/allure/history" ]; then
          echo "[INFO] Syncing Allure History..."
          cp -r gh-pages/allure/history/. allure-results/history/ || true
        fi
        
        # 2. Generate report to TEMP location
        npx allure generate allure-results --clean -o temp-report
        
        # 3. Update Latency History Trend
        npx ts-node scripts/latency-tracker.ts || true

    - name: Finalize & Deploy Preparation
      if: always()
      run: |
        # Create a clean deployment directory
        mkdir -p deploy
        
        # 🏙️ FORCED DASHBOARD GENERATION
        echo "[INFO] Generating Integrated Dashboard..."
        npx ts-node -e "import { IntegratedDashboard } from './reporters/integrated-dashboard'; new IntegratedDashboard().onEnd({ status: 'passed' } as any)" || true
        
        # ATOMIC MOVE: Ensure all data folders (test-cases, attachments) are moved
        if [ -d "temp-report" ]; then
          mv temp-report deploy/allure
          echo "[SUCCESS] Allure report finalized in deploy/allure"
        else
          echo "[ERROR] temp-report not found. Check generate step."
        fi

        # 🔐 SECURITY & VISIBILITY SENTRY: Inject Auth Check and Auto-Filter into Allure sub-report
        if [ -f "deploy/allure/index.html" ]; then
          sed -i 's|<head>|<head><script>if(sessionStorage.getItem("beffa_auth")!=="true"){window.location.href="../";} localStorage.setItem("allure-playwright-marks", JSON.stringify({failed:true,broken:true,passed:true,skipped:true,unknown:true}));</script>|' deploy/allure/index.html
        fi
        
        # Update summary for CI logs
        echo "Primary Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
        echo "Detailed Allure: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/" >> $GITHUB_STEP_SUMMARY

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: deploy
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Upload Test Results Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.run_id }}
        path: |
          playwright-report/
          allure-results/
          deploy/
        retention-days: 7
