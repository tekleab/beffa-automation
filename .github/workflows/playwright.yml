name: Playwright Tests
on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test Suite to Run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - full
          - e2e
      company:
        description: 'Company'
        required: true
        default: 'sample'
        type: choice
        options:
          - 'sample'
          - 'bm technology'
          - 'development'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }}
      BEFFA_USER: ${{ secrets.BEFFA_USER }}
      BEFFA_PASS: ${{ secrets.BEFFA_PASS }}
      BEFFA_TOKEN: ${{ secrets.BEFFA_TOKEN }}
      BEFFA_COMPANY: ${{ github.event.inputs.company || secrets.BEFFA_COMPANY || 'sample' }}
      # On push/PR always run smoke. Manual dispatch uses the selected type.
      TEST_TYPE: ${{ github.event.inputs.test_type || 'smoke' }}
      BEFFA_YEAR: ${{ secrets.BEFFA_YEAR || '2018' }}
      BEFFA_PERIOD: ${{ secrets.BEFFA_PERIOD || 'yearly' }}
      BEFFA_CALENDAR: ${{ secrets.BEFFA_CALENDAR || 'ec' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache playwright binaries
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Browsers & Deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps

    - name: Install Playwright OS Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Fetch Company from ERP API
      if: github.event_name != 'workflow_dispatch'
      continue-on-error: true
      run: |
        chmod +x scripts/fetch_company.sh
        ./scripts/fetch_company.sh

    - name: Run Playwright tests
      if: always()
      continue-on-error: true
      run: |
        # ── Tag → grep mapping ──────────────────────────────────────────────
        # smoke      → @smoke       (fast critical path tests only)
        # regression → @regression  (logic audits and guardrails only)
        # full       → @smoke @regression (merged smoke + regression)
        # e2e        → @e2e         (end-to-end cross-module flows only)
        # ────────────────────────────────────────────────────────────────────
        if [ "$TEST_TYPE" = "smoke" ]; then
          GREP_ARGS="--grep @smoke --grep-invert @regression"
        elif [ "$TEST_TYPE" = "regression" ]; then
          GREP_ARGS="--grep @regression --grep-invert @smoke"
        elif [ "$TEST_TYPE" = "full" ]; then
          GREP_ARGS="--grep (@smoke|@regression)"
        elif [ "$TEST_TYPE" = "e2e" ]; then
          GREP_ARGS="--grep @e2e"
        else
          GREP_ARGS="--grep @smoke --grep-invert @regression"
        fi

        echo "Test Type Selected : $TEST_TYPE"
        echo "Grep Filter        : $GREP_ARGS"
        echo "Company Target     : $BEFFA_COMPANY"
        echo "Trigger            : ${{ github.event_name }}"

        # Reset accumulator and Allure results for a clean run
        mkdir -p deploy
        rm -f deploy/dashboard-accumulated.json
        rm -rf allure-results
        mkdir -p allure-results
        echo "🗑️ Reset dashboard accumulator and Allure results for clean $TEST_TYPE run."

        set +e
        FINAL_EXIT_CODE=0

        # ── PART 1: Standard UI Workflows (parallel) ────────────────────────
        echo "=========================================================="
        echo "🚀 PART 1: Running Standard UI Workflows in Parallel..."
        echo "=========================================================="
        npx playwright test \
          --project=Inventory \
          --project=Sales-Workflows \
          --project=Purchase-Workflows \
          --project=HR \
          --workers=4 \
          $GREP_ARGS \
          --pass-with-no-tests || FINAL_EXIT_CODE=$?

        # ── PART 2: Forensic Audits (sequential, skipped for smoke/e2e) ─────
        if [ "$TEST_TYPE" != "smoke" ] && [ "$TEST_TYPE" != "e2e" ]; then
          echo "=========================================================="
          echo "🛡️ PART 2: Running Deep Forensic Audits (Sequential)..."
          echo "=========================================================="

          echo "-> Forensic Sales..."
          npx playwright test --project=Forensic-Sales --workers=1 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?

          echo "-> Forensic Purchase..."
          npx playwright test --project=Forensic-Purchase --workers=1 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?

          echo "-> Forensic Inventory..."
          npx playwright test --project=Forensic-Inventory --workers=1 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?
        else
          echo "=========================================================="
          echo "⏭️  Skipping Forensic Audits for $TEST_TYPE run."
          echo "=========================================================="
        fi

        # ── PART 3: E2E cross-module flows (only for e2e or full) ───────────
        if [ "$TEST_TYPE" = "e2e" ] || [ "$TEST_TYPE" = "full" ]; then
          echo "=========================================================="
          echo "🔗 PART 3: Running E2E Cross-Module Flows..."
          echo "=========================================================="
          npx playwright test --project=Purchase-Workflows --workers=1 --grep @e2e --pass-with-no-tests || FINAL_EXIT_CODE=$?
        fi

        set -e
        if [ $FINAL_EXIT_CODE -ne 0 ]; then
          echo "❌ Some test batches failed. Check logs above."
          exit $FINAL_EXIT_CODE
        fi

    - name: Get Allure history
      uses: actions/checkout@v4
      if: false
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure Executor Info
      if: always()
      run: |
        mkdir -p allure-results
        echo "{
          \"name\": \"GitHub Actions\",
          \"type\": \"github\",
          \"url\": \"https://github.com/tekleab/beffa-automation/actions/runs/${{ github.run_id }}\",
          \"buildOrder\": \"${{ github.run_id }}\",
          \"buildName\": \"[${{ env.TEST_TYPE }}] Playwright Tests #${{ github.run_id }}\",
          \"buildUrl\": \"https://github.com/tekleab/beffa-automation/actions/runs/${{ github.run_id }}\"
        }" > allure-results/executor.json

        cat > allure-results/environment.properties << EOF
        Test.Suite=${{ env.TEST_TYPE }}
        Company=${{ env.BEFFA_COMPANY }}
        Branch=${{ github.ref_name }}
        Trigger=${{ github.event_name }}
        OS=Linux
        Node=$(node --version)
        Project=BEFFA ERP High-Integrity Suite
        Engine=Integrated-Allure-Reporter
        EOF

    - name: Setup Java for Allure
      uses: actions/setup-java@v3
      if: always()
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Allure Report
      if: always()
      run: |
        # Do not sync history - each run should show only its own results
        npx allure generate allure-results --clean -o temp-report
        npx ts-node scripts/latency-tracker.ts || true

    - name: Finalize & Deploy Preparation
      if: always()
      run: |
        mkdir -p deploy
        echo "[INFO] Generating Integrated Dashboard from Playwright results..."
        npx ts-node scripts/generate-dashboard-from-results.ts || true

        if [ -d "temp-report" ]; then
          mv temp-report deploy/allure
          echo "[SUCCESS] Allure report finalized in deploy/allure"
        else
          echo "[ERROR] temp-report not found. Check generate step."
        fi

        if [ -f "deploy/allure/index.html" ]; then
          sed -i 's|<head>|<head><script>if(sessionStorage.getItem("beffa_auth")!=="true"){window.location.href="../";} localStorage.setItem("allure-playwright-marks", JSON.stringify({failed:true,broken:true,passed:true,skipped:true,unknown:true}));</script>|' deploy/allure/index.html
        fi

        echo "Primary Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
        echo "Detailed Allure: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/" >> $GITHUB_STEP_SUMMARY

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: deploy
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Upload Test Results Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.run_id }}
        path: |
          playwright-report/
          allure-results/
          deploy/
        retention-days: 7
