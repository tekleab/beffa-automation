name: Playwright Tests
run-name: "[${{ github.event.inputs.test_type || github.event.client_payload.test_type || 'sanity' }}] ${{ github.event_name }} → ${{ github.ref_name }} by @${{ github.actor }}"
on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test Suite to Run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - sanity
          - smoke
          - regression
          - full
          - e2e
      company:
        description: 'Company'
        required: true
        default: 'BM Tech'
        type: choice
        options:
          - 'BM Tech'
          - 'Beffa-UAT-Practice'
  deployment_status:
    types: [success]
  repository_dispatch:
    types: [deploy_complete, test_deploy_success]
  push:
    paths-ignore:
      # Ignore commits made by the CI bot itself — prevents infinite loop
      - 'scripts/results.json'
      - 'scripts/results-accumulated.json'
  pull_request:
    paths-ignore:
      - 'scripts/results.json'
      - 'scripts/results-accumulated.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Filter deployment_status events to only fire for the target 'test' environment
    if: ${{ github.event_name != 'deployment_status' || github.event.deployment.environment == 'test' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.50.0-noble

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }}
      BEFFA_USER: ${{ secrets.BEFFA_USER }}
      BEFFA_PASS: ${{ secrets.BEFFA_PASS }}
      BEFFA_COMPANY: ${{ github.event.inputs.company || github.event.client_payload.company || 'BM Tech' }}
      # push/PR → sanity (absolute minimum gate). Use workflow_dispatch for deeper tiers.
      TEST_TYPE: ${{ github.event.inputs.test_type || github.event.client_payload.test_type || 'sanity' }}
      BEFFA_YEAR: ${{ secrets.BEFFA_YEAR || '2019' }}
      BEFFA_PERIOD: ${{ secrets.BEFFA_PERIOD || 'yearly' }}
      BEFFA_CALENDAR: ${{ secrets.BEFFA_CALENDAR || 'ec' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache Playwright browser binaries
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium

    - name: ERP Health Check & Readiness Polling
      id: erp-health
      run: |
        echo "[HEALTH] Checking ERP server reachability & readiness..."
        MAX_ATTEMPTS=24 # 24 attempts * 5s = 120s (2 minutes timeout)
        ATTEMPT=1
        READY=false

        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          FRONTEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL" 2>/dev/null || echo "000")
          API_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$API_URL" 2>/dev/null || echo "000")

          echo "[HEALTH] Attempt $ATTEMPT/$MAX_ATTEMPTS: Frontend ($BASE_URL) → HTTP $FRONTEND_CODE | API ($API_URL) → HTTP $API_CODE"

          if [ "$FRONTEND_CODE" = "200" ] && [ "$API_CODE" = "200" ]; then
            echo "[HEALTH] ✅ ERP application server is fully ready and accepting traffic."
            READY=true
            break
          fi

          echo "[HEALTH] ⏳ Environment not ready yet. Retrying in 5 seconds..."
          sleep 5
          ATTEMPT=$((ATTEMPT + 1))
        done

        if [ "$READY" = "false" ]; then
          echo "::error::❌ ERP test environment failed readiness check after 2 minutes polling timeout."
          echo "::error::→ Frontend ($BASE_URL): HTTP $FRONTEND_CODE | API ($API_URL): HTTP $API_CODE"
          exit 1
        fi

    - name: Fetch Company from ERP API
      if: github.event_name != 'workflow_dispatch'
      continue-on-error: true
      run: |
        chmod +x scripts/fetch-company.sh
        ./scripts/fetch-company.sh

    - name: Run Playwright tests
      if: always()
      continue-on-error: true
      run: |
        # ── 5-Tier Tag Composition (EXCLUSIVE tags + cumulative grep) ──────────
        # Each spec has EXACTLY ONE tier tag. Higher tiers compose via OR patterns:
        #
        # sanity     → --project=Sanity (dedicated spec, no auth, no grep needed)
        # smoke      → @smoke only            (~5-10 min, happy-path flows)
        # regression → @smoke|@regression     (~20-40 min, logic + guardrails)
        # full       → no grep filter         (everything: load, stress, attacks, e2e)
        # e2e        → @e2e (explicit cross-module integration tag, on-demand only)
        # ─────────────────────────────────────────────────────────────────────────

        if [ "${{ github.event_name }}" = "repository_dispatch" ] || [ "${{ github.event_name }}" = "deployment_status" ]; then
          DEPLOY_TRIGGERED=true
        else
          DEPLOY_TRIGGERED=false
        fi

        if [ "$TEST_TYPE" = "sanity" ]; then
          # Dedicated Sanity project: pure connectivity, no auth setup required, <1 min
          echo "=========================================================="
          echo "🟢 SANITY: Connectivity-only checks (no auth required)..."
          echo "=========================================================="
          rm -rf allure-results && mkdir -p allure-results
          npx playwright test \
            --project=Sanity \
            --workers=4 \
            --grep @sanity \
            --pass-with-no-tests || exit $?
          exit 0

        elif [ "$TEST_TYPE" = "smoke" ]; then
          # Smoke: ONLY @smoke-tagged tests (exclusive — no regression/full leakthrough)
          GREP_ARGS="--grep @smoke"
          PROJECTS="--project=Sales --project=Purchase --project=Cross-Module --project=HR --project=Project-Management --project=Inventory"

        elif [ "$TEST_TYPE" = "regression" ]; then
          # Regression: smoke tier + regression tier (cumulative upward via OR)
          GREP_ARGS="--grep @smoke|@regression"
          PROJECTS="--project=Sales --project=Purchase --project=Cross-Module --project=HR --project=Project-Management --project=Inventory"

        elif [ "$TEST_TYPE" = "e2e" ]; then
          # E2E: only explicitly tagged cross-module integration flows
          GREP_ARGS="--grep @e2e"
          PROJECTS="--project=Cross-Module --project=Purchase --project=Sales"

        elif [ "$TEST_TYPE" = "full" ]; then
          # Full: no grep filter — every test in every project runs
          echo "=========================================================="
          echo "🚀 FULL SUITE: ALL projects, ALL tiers, no filter..."
          echo "=========================================================="
          rm -rf allure-results && mkdir -p allure-results
          npx playwright test --workers=4 --pass-with-no-tests || exit $?
          exit 0

        else
          # Fallback (push/PR with no TEST_TYPE) → sanity gate
          echo "=========================================================="
          echo "🟢 SANITY (fallback): push/PR connectivity-only gate..."
          echo "=========================================================="
          rm -rf allure-results && mkdir -p allure-results
          npx playwright test \
            --project=Sanity \
            --workers=4 \
            --grep @sanity \
            --pass-with-no-tests || exit $?
          exit 0
        fi

        echo "Test Type Selected : $TEST_TYPE"
        echo "Grep Filter        : $GREP_ARGS"
        echo "Company Target     : $BEFFA_COMPANY"
        echo "Trigger            : ${{ github.event_name }}"
        echo "Deploy Triggered   : $DEPLOY_TRIGGERED"

        # Reset Allure results for a clean run
        rm -rf allure-results && mkdir -p allure-results

        set +e
        FINAL_EXIT_CODE=0

        # ── Run test tier against scoped project list ────────────────────────
        echo "=========================================================="
        echo "🚀 Running $TEST_TYPE tier: $GREP_ARGS"
        echo "   Projects: $PROJECTS"
        echo "=========================================================="
        npx playwright test \
          $PROJECTS \
          --workers=4 \
          $GREP_ARGS \
          --pass-with-no-tests || FINAL_EXIT_CODE=$?

        set -e
        if [ $FINAL_EXIT_CODE -ne 0 ]; then
          echo "❌ Some test batches failed. Check logs above."
          exit $FINAL_EXIT_CODE
        fi

    - name: Setup Java JRE for Allure Report
      uses: actions/setup-java@v4
      if: always()
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache Allure CLI
      uses: actions/cache@v4
      id: allure-cli-cache
      with:
        path: ~/.npm-global
        key: allure-cli-2.32.0

    - name: Install Allure CLI
      if: steps.allure-cli-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.npm-global
        npm install -g --prefix ~/.npm-global allure-commandline@2.32.0

    - name: Get Allure history (shallow)
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages
        sparse-checkout: |
          allure/history
        fetch-depth: 1

    - name: Generate Allure Executor Info
      if: always()
      run: |
        mkdir -p allure-results
        echo "{
          \"name\": \"GitHub Actions\",
          \"type\": \"github\",
          \"url\": \"https://github.com/tekleab/beffa-automation/actions/runs/${{ github.run_id }}\",
          \"buildOrder\": \"${{ github.run_id }}\",
          \"buildName\": \"[${{ env.TEST_TYPE }}] Playwright Tests #${{ github.run_id }}\",
          \"buildUrl\": \"https://github.com/tekleab/beffa-automation/actions/runs/${{ github.run_id }}\"
        }" > allure-results/executor.json
        cat > allure-results/environment.properties << EOF
        Test.Suite=${{ env.TEST_TYPE }}
        Company=${{ env.BEFFA_COMPANY }}
        Branch=${{ github.ref_name }}
        Trigger=${{ github.event_name }}
        OS=Linux
        Node=$(node --version)
        Project=BEFFA ERP High-Integrity Suite
        Engine=Integrated-Allure-Reporter
        EOF

    - name: Generate Allure Report
      if: always()
      run: |
        export PATH=~/.npm-global/bin:$PATH
        if [ -d "gh-pages/allure/history" ]; then
          cp -r gh-pages/allure/history allure-results/history
        fi
        if [ -f "allure-categories.json" ]; then
          cp allure-categories.json allure-results/categories.json
        fi
        allure generate allure-results --clean -o temp-report
        if [ ! -f "temp-report/index.html" ]; then
          echo "ERROR: Allure report index.html not found"; exit 1
        fi

    - name: Finalize & Deploy Preparation
      if: always()
      run: |
        mkdir -p deploy
        node scripts/results.js || true
        if [ "$TEST_TYPE" = "full" ]; then
          node scripts/modules.js || true
          node scripts/modules.js --markdown || true
          [ -f test-results/module-statistics.json ] && cp test-results/module-statistics.json deploy/
          [ -f test-results/module-report.md ] && cp test-results/module-report.md deploy/
        fi
        cp scripts/qa-dashboard.html deploy/index.html
        cp scripts/qa-dashboard.html deploy/qa-dashboard.html
        cp scripts/results.json deploy/results.json
        if [ -d temp-report ]; then
          mv temp-report deploy/allure
        fi
        # Always preserve previous Allure history in deploy so keep_files=false doesn't lose trend data
        if [ -d gh-pages/allure/history ] && [ -d deploy/allure ]; then
          cp -r gh-pages/allure/history deploy/allure/history
        fi
        if [ -f deploy/allure/index.html ]; then
          sed -i 's|<head>|<head><script>localStorage.setItem("allure-playwright-marks", JSON.stringify({failed:true,broken:true,passed:true,skipped:true,unknown:true}));</script>|' deploy/allure/index.html
        fi
        echo "Primary Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
        echo "QA Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/qa-dashboard.html" >> $GITHUB_STEP_SUMMARY
        echo "Detailed Allure: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/" >> $GITHUB_STEP_SUMMARY

    - name: Commit and push results.json
      if: always()
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add scripts/results.json scripts/results-accumulated.json
        git diff --staged --quiet && exit 0
        git commit -m "chore: update results.json from CI run [skip ci]"
        # Stash any unstaged CI artifacts before rebasing, then restore
        git stash --include-untracked
        git pull --rebase origin main
        git stash pop || true
        git push origin HEAD:main

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: deploy
        publish_branch: gh-pages
        keep_files: false
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Upload Test Results Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.run_id }}
        path: |
          playwright-report/
          allure-results/
        retention-days: 7
