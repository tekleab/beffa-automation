name: Playwright Tests
run-name: "[${{ github.event.inputs.test_type || 'smoke' }}] ${{ github.event_name }} → ${{ github.ref_name }} by @${{ github.actor }}"
on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test Suite to Run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - full
          - e2e
      company:
        description: 'Company'
        required: true
        default: 'BM Tech'
        type: choice
        options:
          - 'BM Tech'
          - 'Beffa-UAT-Practice'
  push:
    paths-ignore:
      # Ignore commits made by the CI bot itself — prevents infinite loop
      - 'scripts/results.json'
      - 'scripts/results-accumulated.json'
  pull_request:
    paths-ignore:
      - 'scripts/results.json'
      - 'scripts/results-accumulated.json'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_URL: ${{ secrets.API_URL }}
      BEFFA_USER: ${{ secrets.BEFFA_USER }}
      BEFFA_PASS: ${{ secrets.BEFFA_PASS }}
      BEFFA_TOKEN: ${{ secrets.BEFFA_TOKEN }}
      BEFFA_COMPANY: ${{ github.event.inputs.company || secrets.BEFFA_COMPANY || 'BM Tech' }}
      # push/PR → smoke (fast gate, ~10 min). Use workflow_dispatch for full/regression.
      TEST_TYPE: ${{ github.event.inputs.test_type || 'smoke' }}
      BEFFA_YEAR: ${{ secrets.BEFFA_YEAR || '2018' }}
      BEFFA_PERIOD: ${{ secrets.BEFFA_PERIOD || 'yearly' }}
      BEFFA_CALENDAR: ${{ secrets.BEFFA_CALENDAR || 'ec' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Get installed Playwright version
      id: playwright-version
      run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache playwright binaries
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: |
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Browsers & Deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps

    - name: Install Playwright OS Dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: ERP Health Check
      id: erp-health
      continue-on-error: true
      run: |
        echo "[HEALTH] Checking ERP server reachability..."
        FRONTEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$BASE_URL" 2>/dev/null || echo "000")
        API_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$API_URL" 2>/dev/null || echo "000")

        echo "[HEALTH] Frontend ($BASE_URL) → HTTP $FRONTEND_CODE"
        echo "[HEALTH] API      ($API_URL)  → HTTP $API_CODE"

        if [ "$FRONTEND_CODE" = "000" ] && [ "$API_CODE" = "000" ]; then
          echo "::error::❌ ERP server is UNREACHABLE (Frontend: $FRONTEND_CODE, API: $API_CODE). Aborting pipeline."
          echo "::error::→ Check BASE_URL and API_URL GitHub Secrets and confirm the server is running."
          exit 1
        fi

        if [ "$FRONTEND_CODE" = "000" ]; then
          echo "::warning::Frontend ($BASE_URL) is unreachable — UI tests will likely fail."
        fi
        if [ "$API_CODE" = "000" ]; then
          echo "::warning::API ($API_URL) is unreachable — API-driven tests will likely fail."
        fi
        echo "[HEALTH] ✅ ERP server connectivity confirmed."

    - name: Fetch Company from ERP API
      if: github.event_name != 'workflow_dispatch'
      continue-on-error: true
      run: |
        chmod +x scripts/fetch-company.sh
        ./scripts/fetch-company.sh

    - name: Run Playwright tests
      if: always()
      continue-on-error: true
      run: |
        # ── Tag → grep mapping ──────────────────────────────────────────────
        # smoke      → @smoke       (fast critical path tests only)
        # regression → @regression  (logic audits and guardrails only)
        # full       → @smoke @regression (merged smoke + regression)
        # e2e        → @e2e         (end-to-end cross-module flows only)
        # ────────────────────────────────────────────────────────────────────
        if [ "$TEST_TYPE" = "smoke" ]; then
          GREP_ARGS="--grep @smoke --grep-invert @regression"
        elif [ "$TEST_TYPE" = "regression" ]; then
          GREP_ARGS="--grep @regression --grep-invert @smoke"
        elif [ "$TEST_TYPE" = "full" ]; then
          GREP_ARGS="--grep @full"
          # For @full tests, we run ALL projects with 4 workers
          echo "=========================================================="
          echo "🚀 FULL SUITE: Running ALL Projects with 4 Workers..."
          echo "=========================================================="
          npx playwright test \
            --workers=4 \
            $GREP_ARGS \
            --pass-with-no-tests || FINAL_EXIT_CODE=$?
          # Skip the separate parts for full - everything runs together
          exit $FINAL_EXIT_CODE
        elif [ "$TEST_TYPE" = "e2e" ]; then
          GREP_ARGS="--grep @e2e"
        else
          GREP_ARGS="--grep @smoke --grep-invert @regression"
        fi

        echo "Test Type Selected : $TEST_TYPE"
        echo "Grep Filter        : $GREP_ARGS"
        echo "Company Target     : $BEFFA_COMPANY"
        echo "Trigger            : ${{ github.event_name }}"

        # Reset accumulator and Allure results for a clean run
        mkdir -p deploy
        rm -f deploy/dashboard-accumulated.json
        rm -rf allure-results
        mkdir -p allure-results
        echo "🗑️ Reset dashboard accumulator and Allure results for clean $TEST_TYPE run."

        set +e
        FINAL_EXIT_CODE=0

        # ── PART 1: Standard UI Workflows (parallel) ────────────────────────
        if [ "$TEST_TYPE" != "full" ]; then
          echo "=========================================================="
          echo "🚀 PART 1: Running Standard UI Workflows in Parallel..."
          echo "=========================================================="
          npx playwright test \
            --project=Sales \
            --project=Purchase \
            --project=Cross-Module \
            --project=HR \
            --project=Project-Management \
            --workers=4 \
            $GREP_ARGS \
            --pass-with-no-tests || FINAL_EXIT_CODE=$?
        fi

        # ── PART 2: Forensic Audits (sequential — runs for regression + full) ──────
        if [ "$TEST_TYPE" = "regression" ]; then
          echo "=========================================================="
          echo "🛡️ PART 2: Running Deep Forensic Audits (Sequential)..."
          echo "=========================================================="

          echo "--> Forensic Sales..."
          npx playwright test --project=Sales --workers=2 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?

          echo "--> Forensic Purchase..."
          npx playwright test --project=Purchase --workers=2 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?

          echo "--> Forensic Inventory..."
          npx playwright test --project=Inventory --workers=2 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?

          echo "--> Forensic Project Management..."
          npx playwright test --project=Project-Management --workers=4 $GREP_ARGS --pass-with-no-tests || FINAL_EXIT_CODE=$?
        elif [ "$TEST_TYPE" != "full" ]; then
          echo "=========================================================="
          echo "⏭️  Skipping Forensic Audits for $TEST_TYPE run."
          echo "=========================================================="
        fi

        # ── PART 3: E2E cross-module flows (only for e2e) ───────────
        if [ "$TEST_TYPE" = "e2e" ]; then
          echo "=========================================================="
          echo "🔗 PART 3: Running E2E Cross-Module Flows..."
          echo "=========================================================="
          npx playwright test --project=Purchase --workers=1 --grep @e2e --pass-with-no-tests || FINAL_EXIT_CODE=$?
        fi

        set -e
        if [ $FINAL_EXIT_CODE -ne 0 ]; then
          echo "❌ Some test batches failed. Check logs above."
          exit $FINAL_EXIT_CODE
        fi

    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Generate Allure Executor Info
      if: always()
      run: |
        mkdir -p allure-results
        echo "{
          \"name\": \"GitHub Actions\",
          \"type\": \"github\",
          \"url\": \"https://github.com/tekleab/beffa-automation/actions/runs/${{ github.run_id }}\",
          \"buildOrder\": \"${{ github.run_id }}\",
          \"buildName\": \"[${{ env.TEST_TYPE }}] Playwright Tests #${{ github.run_id }}\",
          \"buildUrl\": \"https://github.com/tekleab/beffa-automation/actions/runs/${{ github.run_id }}\"
        }" > allure-results/executor.json

        cat > allure-results/environment.properties << EOF
        Test.Suite=${{ env.TEST_TYPE }}
        Company=${{ env.BEFFA_COMPANY }}
        Branch=${{ github.ref_name }}
        Trigger=${{ github.event_name }}
        OS=Linux
        Node=$(node --version)
        Project=BEFFA ERP High-Integrity Suite
        Engine=Integrated-Allure-Reporter
        EOF

    - name: Setup Java for Allure
      uses: actions/setup-java@v4
      if: always()
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Allure CLI
      if: always()
      run: |
        # Use local allure-commandline from node_modules to match allure-playwright version
        npm install -g allure-commandline@2.32.0
        export PATH=$(npm bin -g):$PATH
        allure --version

    - name: Generate Allure Report
      if: always()
      run: |
        # Restore history from previous deploy so trend/retry/category charts populate
        if [ -d "gh-pages/allure/history" ]; then
          echo "[INFO] Restoring Allure history from gh-pages..."
          cp -r gh-pages/allure/history allure-results/history
        else
          echo "[INFO] No prior Allure history found — first run or history missing."
        fi
        ls allure-results/ | head -20 || echo "[WARN] allure-results is empty"
        npx allure generate allure-results --clean -o temp-report
        if [ ! -f "temp-report/index.html" ]; then
          echo "ERROR: Allure report index.html not found"
          exit 1
        fi
        echo "Allure report generated successfully"
        npx ts-node scripts/latency.ts || true

    - name: Finalize & Deploy Preparation
      if: always()
      run: |
        mkdir -p deploy
        echo "[INFO] Generating Integrated Dashboard from Playwright results..."
        npx ts-node scripts/dashboard-builder.ts || true

        echo "[INFO] Generating results.json for QA Dashboard..."
        node scripts/results.js || true
        
        # Generate module statistics report for full test runs
        if [ "$TEST_TYPE" = "full" ]; then
          echo "[INFO] Generating module statistics for full test run..."
          node scripts/modules.js || true
          node scripts/modules.js --markdown || true
          
          # Copy module reports to deploy if they exist
          if [ -f "test-results/module-statistics.json" ]; then
            cp test-results/module-statistics.json deploy/
            echo "[SUCCESS] Module statistics copied to deploy directory"
          fi
          if [ -f "test-results/module-report.md" ]; then
            cp test-results/module-report.md deploy/
            echo "[SUCCESS] Module markdown report copied to deploy directory"
          fi
        fi

        echo "[INFO] Copying QA Dashboard to deploy directory..."
        cp scripts/qa-dashboard.html deploy/qa-dashboard.html
        cp scripts/qa-dashboard.html deploy/index.html
        cp scripts/results.json deploy/results.json

        if [ -d "temp-report" ]; then
          mv temp-report deploy/allure
          echo "[SUCCESS] Allure report finalized in deploy/allure"
        else
          echo "[ERROR] temp-report not found. Check generate step."
        fi

        if [ -f "deploy/allure/index.html" ]; then
          sed -i 's|<head>|<head><script>localStorage.setItem("allure-playwright-marks", JSON.stringify({failed:true,broken:true,passed:true,skipped:true,unknown:true}));</script>|' deploy/allure/index.html
        fi

        echo "Primary Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
        echo "QA Dashboard: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/qa-dashboard.html" >> $GITHUB_STEP_SUMMARY
        echo "Detailed Allure: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/" >> $GITHUB_STEP_SUMMARY
        
        # Add module report links for full test runs
        if [ "$TEST_TYPE" = "full" ] && [ -f "deploy/module-report.md" ]; then
          echo "Module Statistics: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/module-report.md" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Commit and push results.json
      if: always()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add scripts/results.json scripts/results-accumulated.json
        git diff --staged --quiet || git commit -m "chore: update results.json from CI run [skip ci]"
        git push origin HEAD:main

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: deploy
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Upload Test Results Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.run_id }}
        path: |
          playwright-report/
          allure-results/
          deploy/
        retention-days: 7
